[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmm_printer"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyserial",
    "numpy",
    "smbus",
    "spidev",
    "pillow",
    "platformdirs",
    "pyyaml",
]

[tool.lmm_printer]
apt_pckgs = ["python3-numpy" , "python3-smbus" , "python3-spidev" , "python3-pil" , "python3-yaml"]

[tool.setuptools.packages.find]
where = ["src"]
