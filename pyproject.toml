[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmm_printer"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyserial",
    "numpy",
    "smbus",
    "spidev",
    "pillow",
]

[tool.setuptools.packages.find]
where = ["src"]
